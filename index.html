
<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عِش اللحظة</title>
    <link rel="stylesheet" href="style.css">

    <script type="module">
        import { pipeline } from
            "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

        window.loadWhisperModel = async function () {
            const micStatus = document.getElementById("micStatus");

            try {
                micStatus.textContent = "AI model loading...";

                window.whisperTranscriber = await pipeline(
                    "automatic-speech-recognition",
                    "Xenova/whisper-tiny",
                    { dtype: "q8" }
                );

                micStatus.textContent = "AI model loaded!";
            } catch (error) {
                micStatus.textContent = "Error: " + error.message;
                console.error(error);
            }
        };

        window.testWhisperMic = async function () {
            const micStatus = document.getElementById("micStatus");

            try {
                if (!window.whisperTranscriber) {
                    micStatus.textContent = "Pehle AI model load karein.";
                    return;
                }

                micStatus.textContent = "Microphone permission mang raha hai...";

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                micStatus.textContent = "Microphone working! 🎤";

                stream.getTracks().forEach(track => track.stop());

            } catch (error) {
                micStatus.textContent = "Microphone error: " + error.message;
                console.error(error);
            }
        };

        window.startWhisperListening = async function () {
            const micStatus = document.getElementById("micStatus");

            try {
                if (!window.whisperTranscriber) {
                    micStatus.textContent = "Pehle AI model load karein.";
                    return;
                }

                micStatus.textContent = "Microphone permission mang raha hai...";

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                const recorder = new MediaRecorder(stream);
                const chunks = [];

                recorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };

                recorder.onstop = async function () {
                    try {
                        micStatus.textContent = "Awaaz process ho rahi hai...";

                        const audioBlob = new Blob(chunks, {
                            type: recorder.mimeType
                        });

                        const audioUrl = URL.createObjectURL(audioBlob);

                        const result = await window.whisperTranscriber(audioUrl);

                        micStatus.textContent =
                            "Pehchane gaye alfaaz: " + result.text;

                        console.log(
                            "Whisper ne ye alfaaz pehchane:",
                            result.text
                        );

                        URL.revokeObjectURL(audioUrl);

                    } catch (error) {
                        micStatus.textContent =
                            "Recognition error: " + error.message;
                        console.error(error);
                    }

                    stream.getTracks().forEach(track => track.stop());
                };

                recorder.start();

                micStatus.textContent = "Ab 5 seconds tak boliye...";

                setTimeout(() => {
                    if (recorder.state === "recording") {
                        recorder.stop();
                    }
                }, 5000);

            } catch (error) {
                micStatus.textContent =
                    "Microphone error: " + error.message;
                console.error(error);
            }
        };
    </script>
</head>

<body>

    <button onclick="loadWhisperModel()">
        AI Model Load Karein
    </button>

    <button onclick="testWhisperMic()">
        🎤 Whisper Microphone Test
    </button>

    <button onclick="startWhisperListening()">
        🎙️ Voice Recognition Test
    </button>

    <main class="container">
        <h1>عِش اللحظة</h1>
        <p class="subtitle">نماز کے ساتھ جڑے رہیے</p>

        <section class="prayer-card">
            <h2>عشاء کی نماز</h2>

            <p>موجودہ رکعت</p>
            <div id="rakatNumber">1</div>

            <p id="status">تجربہ شروع کرنے کے لیے تیار</p>

            <div class="buttons">
                <button onclick="testRakat(1)">پہلی رکعت</button>
                <button onclick="testRakat(2)">دوسری رکعت</button>
                <button onclick="testRakat(3)">تیسری رکعت</button>
                <button onclick="testRakat(4)">چوتھی رکعت</button>
                <button class="salam" onclick="testSalam()">سلام</button>
            </div>
        </section>

        <p class="note">
            یہ صرف وائبریشن کا تجربہ ہے۔ رکعت خودکار طور پر معلوم نہیں ہوتی۔
        </p>
    </main>

    <div class="mic-test">
        <h2>مائیک ٹیسٹ</h2>

        <button id="micButton" onclick="listenToMicrophone()">
            🎤 مائیک ٹیسٹ شروع کریں
        </button>

        <p id="micStatus">مائیک ابھی بند ہے</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
