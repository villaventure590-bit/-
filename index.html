
<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عِش اللحظة</title>

    <link rel="stylesheet" href="style.css">

    
<script type="module">

import { pipeline } from
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

// =====================================
// 1. LOAD WHISPER AI MODEL
// =====================================

window.loadWhisperModel = async function () {

    const micStatus = document.getElementById("micStatus");

    try {
        micStatus.textContent = "AI model loading...";

        window.whisperTranscriber = await pipeline(
            "automatic-speech-recognition",
            "Xenova/whisper-tiny",
            { dtype: "q8" }
        );

        micStatus.textContent = "AI model loaded!";

    } catch (error) {
        micStatus.textContent = "Model error: " + error.message;
        console.error(error);
    }
};


// =====================================
// 2. TEST MICROPHONE
// =====================================

window.testWhisperMic = async function () {

    const micStatus = document.getElementById("micStatus");

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        micStatus.textContent = "Microphone working!";

        stream.getTracks().forEach(track => track.stop());

    } catch (error) {
        micStatus.textContent = "Microphone error: " + error.message;
        console.error(error);
    }
};


// =====================================
// 3. START TAKBEER LISTENING
// =====================================

window.startWhisperListening = async function () {

    const micStatus = document.getElementById("micStatus");
    const recognizedText = document.getElementById("recognizedText");

    if (!window.whisperTranscriber) {
        micStatus.textContent = "Pehle AI model load karein.";
        return;
    }

    if (window.whisperIsListening) {
        micStatus.textContent = "Microphone already listening.";
        return;
    }

    let stream;
    let recorder = null;
    let stopped = false;
    let chunkTimer = null;

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        window.whisperIsListening = true;

        micStatus.textContent = "Microphone active — Listening...";
        recognizedText.textContent = "اللہ اکبر ka intezar hai...";

        window.stopWhisperListening = function () {

            stopped = true;
            window.whisperIsListening = false;

            if (chunkTimer) {
                clearTimeout(chunkTimer);
            }

            if (recorder && recorder.state === "recording") {
                recorder.stop();
            }

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            micStatus.textContent = "Listening stopped.";
        };


        // RECORD AUDIO IN 8 SECOND PARTS

        async function listenPart() {

            if (stopped) return;

            try {

                recorder = new MediaRecorder(stream);

                const chunks = [];

                recorder.ondataavailable = function (event) {

                    if (event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };


                recorder.onstop = async function () {

                    if (chunkTimer) {
                        clearTimeout(chunkTimer);
                        chunkTimer = null;
                    }

                    if (stopped) return;

                    micStatus.textContent = "Processing voice...";

                    let audioUrl = null;

                    try {

                        const audioBlob = new Blob(chunks, {
                            type: recorder.mimeType || "audio/webm"
                        });

                        audioUrl = URL.createObjectURL(audioBlob);

                        const result = await window.whisperTranscriber(
                            audioUrl,
                            {
                                language: "arabic",
                                task: "transcribe"
                            }
                        );

                        if (stopped) return;

                        // CLEAN ARABIC TEXT

                        const text = (result.text || "")
                            .replace(/[ًٌٍَُِّْـ]/g, "")
                            .replace(/[إأآٱ]/g, "ا")
                            .replace(/[،.,!?؟]/g, " ")
                            .replace(/\s+/g, " ")
                            .trim();

                        // ONLY ACCEPT ALLAHU AKBAR

                        const takbeerPattern =
                            /(^|\s)الله\s+اكبر(\s|$)/;

                        if (takbeerPattern.test(text)) {

                            recognizedText.textContent = "اللہ اکبر";
                            micStatus.textContent = "Takbeer detected.";

                        } else {

                            recognizedText.textContent =
                                "اللہ اکبر ka intezar hai...";

                            micStatus.textContent =
                                "Microphone active — Listening...";
                        }

                    } catch (error) {

                        if (!stopped) {
                            micStatus.textContent =
                                "Recognition error: " + error.message;
                        }

                        console.error(error);

                    } finally {

                        if (audioUrl) {
                            URL.revokeObjectURL(audioUrl);
                        }
                    }

                    // START NEXT RECORDING

                    if (!stopped) {
                        listenPart();
                    }
                };


                recorder.start();

                micStatus.textContent = "Microphone active — Listening...";

                chunkTimer = setTimeout(function () {

                    if (recorder && recorder.state === "recording") {
                        recorder.stop();
                    }

                }, 8000);

            } catch (error) {

                micStatus.textContent =
                    "Recording error: " + error.message;

                console.error(error);

                window.stopWhisperListening();
            }
        }

        listenPart();

    } catch (error) {

        window.whisperIsListening = false;

        micStatus.textContent =
            "Microphone error: " + error.message;

        console.error(error);
    }
};

</script>

<script src="script.js"></script>

</body>

</html>
